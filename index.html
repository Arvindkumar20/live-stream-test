    <title>CMSV6 Live Stream</title>

<script>
(() => {
  const original = MediaSource.prototype.addSourceBuffer;
  let audioBuffer = null;
  let videoBuffer = null;
  let corrected = false;

  MediaSource.prototype.addSourceBuffer = function (mime) {
    const sb = original.call(this, mime);

    if (mime.startsWith("audio/")) {
      audioBuffer = sb;
    }

    if (mime.startsWith("video/")) {
      videoBuffer = sb;
    }

    function synchronize() {
      if (corrected || !audioBuffer || !videoBuffer) return;
      if (audioBuffer.updating || videoBuffer.updating) return;

      try {
        if (!audioBuffer.buffered.length ||
            !videoBuffer.buffered.length) return;

        const audioStart = audioBuffer.buffered.start(0);
        const videoStart = videoBuffer.buffered.start(0);

        const difference = audioStart - videoStart;

        if (Math.abs(difference) > 5) {
          audioBuffer.timestampOffset = -difference;
          corrected = true;

          console.log(
            "[CMS FIX] Audio timestamp offset:",
            -difference
          );
        }
      } catch (error) {
        console.warn("[CMS FIX]", error.message);
      }
    }

    sb.addEventListener("updateend", synchronize);

    return sb;
  };
})();
</script>

<script src="./cmsv6player.min.js"></script>
